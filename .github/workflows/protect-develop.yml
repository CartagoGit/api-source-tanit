name: protect-develop

# Aplica y mantiene branch protection en `develop` con la política
# declarada en `delendai.config.json`.
#
# Por qué un workflow y no un comando manual
# ──────────────────────────────────────────
# La protección de rama en GitHub se configura vía la REST API
# (`PUT /repos/:owner/:repo/branches/:branch/protection`). El CLI
# `gh` también puede, pero requiere un token con scope `admin:repo`
# (PAT o GitHub App) — el `GITHUB_TOKEN` que viene por defecto en
# los workflows NO tiene ese scope. La forma estándar de la
# plataforma es mantener un workflow con un secret dedicado
# (`REPO_ADMIN_TOKEN` o el equivalente desde GitHub Apps).
#
# Por qué workflow_dispatch y no automático
# ────────────────────────────────────────
# Aplicar protección en cada push crea un loop:
#   push → workflow → API call → push (??)
# GitHub lo previene pero el workflow se vuelve ruidoso y la
# intención se pierde. La forma sensata es:
#   - manual (workflow_dispatch) cuando el catálogo de checks cambia
#   - automática (repository_dispatch) cuando se publica un release,
#     para mantener `enforce_admins` alineado con la política.
# Aquí dejamos el manual por ahora; el auto-trigger es una segunda
# iteración si el equipo decide que vale la pena.
#
# Por qué falla sin secret
# ────────────────────────
# El workflow falla si `REPO_ADMIN_TOKEN` no existe. Una ejecución
# verde sin permisos no es evidencia de protección aplicada.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to protect"
        required: false
        default: "develop"
        type: string
permissions:
  # `contents: read` viene del default; lo que NECESITAMOS es
  # `administration: write`, pero GITHUB_TOKEN no la tiene. Por eso
  # este workflow usa un PAT/GitHub App explícito.
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify required secret
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REPO_ADMIN_TOKEN is required to apply branch protection."
            exit 1
          fi
          echo "→ REPO_ADMIN_TOKEN present; proceeding with the API call."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Apply branch protection
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          BRANCH: ${{ inputs.branch || 'develop' }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.api_url }}
        run: |
          # The verifier and applicator share one policy implementation.
          # Explicit false values and release strictness retain their meaning.
          PAYLOAD=$(bun scripts/gates/branch-protection-payload.script.ts "$BRANCH")
          CONTEXTS=$(echo "$PAYLOAD" | jq -c '.required_status_checks.contexts')

          echo "→ PATCH ${API_BASE}/repos/${REPO}/branches/${BRANCH}/protection"
          HTTP_CODE=$(curl -sS -o /tmp/protect-response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_BASE}/repos/${REPO}/branches/${BRANCH}/protection" \
            -d "${PAYLOAD}")

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Branch protection applied to '${BRANCH}'."
            echo "→ Required checks:"
            echo "${CONTEXTS}" | tr ',' '\n' | sed 's/[]"[]//g' | sed 's/^/  - /'
            echo ""
            echo "→ Verify with:"
            echo "  curl -H \"Authorization: Bearer \${TOKEN}\" \\"
            echo "    ${API_BASE}/repos/${REPO}/branches/${BRANCH}/protection"
          else
            echo "✗ API call failed with HTTP ${HTTP_CODE}."
            cat /tmp/protect-response.json
            exit 1
          fi

      - name: Verify the protection is in place
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          BRANCH: ${{ inputs.branch || 'develop' }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.api_url }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE}/repos/${REPO}/branches/${BRANCH}/protection")

          PROTECTED=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print('yes' if data.get('enabled') is True or 'required_status_checks' in data else 'no')
          ")
          CONTEXTS=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(len(data.get('required_status_checks', {}).get('contexts', [])))
          " 2>/dev/null || echo "0")

          echo "→ branch='${{ inputs.branch || 'develop' }}' protected=${PROTECTED} required_checks=${CONTEXTS}"
          EXPECTED=$(jq '.development.integration.requiredChecks | length' delendai.config.json)
          if [ "$PROTECTED" != "yes" ] || [ "$CONTEXTS" -ne "$EXPECTED" ]; then
            echo "✗ Verification failed."
            exit 1
          fi
          echo "✓ Verification OK."

      - name: Apply the repository merge strategy
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.api_url }}
        run: |
          # `mergeMethod` says HOW a change lands. GitHub keeps a
          # separate switch for whether a merge commit may be created at
          # all, and the two are not the same thing: with
          # `allow_merge_commit: false` the policy's `merge` is a
          # sentence nobody can execute, the integration silently falls
          # back to squash, and the history gets flattened — the graph
          # stops saying where the work came from.
          #
          # That is not a hypothetical. The policy said `merge` while
          # the repository still only allowed `squash`, and the two
          # disagreed in exactly the way that hides the branches: the
          # work landed, and nothing said which line it came from.
          # This step makes the forge agree with the policy, so the
          # policy is the only answer again.
          #
          # GitHub refuses to leave fewer than two strategies enabled
          # ("you need to allow either squash or rebase merge
          # strategies, or both"), so the policy's method is enabled
          # together with squash. The policy still decides which one the
          # integration actually uses.
          MERGE_METHOD=$(jq -r '.development.integration.mergeMethod // "squash"' delendai.config.json)
          case "$MERGE_METHOD" in
            merge)
              ALLOW_MERGE=true; ALLOW_SQUASH=true; ALLOW_REBASE=false ;;
            squash)
              ALLOW_MERGE=false; ALLOW_SQUASH=true; ALLOW_REBASE=false ;;
            rebase)
              ALLOW_MERGE=false; ALLOW_SQUASH=true; ALLOW_REBASE=true ;;
            *)
              echo "::error::.development.integration.mergeMethod='${MERGE_METHOD}' is not a method this workflow knows."
              echo "Declare it as merge, squash or rebase. A strategy applied from a"
              echo "guess is how a branch ends up landing in a way nobody declared."
              exit 1 ;;
          esac

          echo "→ mergeMethod=${MERGE_METHOD} → merge=${ALLOW_MERGE} squash=${ALLOW_SQUASH} rebase=${ALLOW_REBASE}"
          HTTP_CODE=$(curl -sS -o /tmp/merge-strategy-response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_BASE}/repos/${REPO}" \
            -d "{\"allow_merge_commit\": ${ALLOW_MERGE}, \"allow_squash_merge\": ${ALLOW_SQUASH}, \"allow_rebase_merge\": ${ALLOW_REBASE}}")

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Merge strategy applied: merge=${ALLOW_MERGE} squash=${ALLOW_SQUASH} rebase=${ALLOW_REBASE}"
          else
            echo "✗ API call failed with HTTP ${HTTP_CODE}."
            cat /tmp/merge-strategy-response.json
            exit 1
          fi

      - name: Verify the merge strategy is in place
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.api_url }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE}/repos/${REPO}")

          MERGE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print('yes' if data.get('allow_merge_commit') else 'no')
          ")
          EXPECTED=$(jq -r 'if .development.integration.mergeMethod == "merge" then "yes" else "no" end' delendai.config.json)

          echo "→ allow_merge_commit=${MERGE} expected=${EXPECTED}"
          if [ "$MERGE" != "$EXPECTED" ]; then
            echo "✗ Verification failed."
            echo "The repository does not allow what the policy declares. Merge it with"
            echo "the method the policy names, or change the policy."
            exit 1
          fi
          echo "✓ Verification OK."

      # The `required-checks` RULESET that used to live here has been
      # removed on purpose. It applied a second, differently-sourced
      # check list on top of classic branch protection, so the forge
      # itself carried two answers to "what must pass on develop" — and
      # they had already diverged. Classic protection is the one the
      # development policy projects and the one the guards read; a
      # second mechanism cannot make the branch safer than the stricter
      # of the two, and it can make the repository unreadable.
