name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Tanit valida su propio producto. La integración opcional con
# Delendai vive en `.github/workflows/integration-delendai.yml`
# (x00041, x00045): el plugin no entra en `workspaces`, no aparece
# en `files`, y la CI principal no clona Delendai — esa frontera
# es la que x00045 levanta.
env: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`: el gate `lint:proposals` con x00032 S1 (regla 2)
      # verifica que cada `shippedIn:` sea un commit alcanzable
      # (`git cat-file -e`). El checkout por defecto de `actions/checkout`
      # es shallow (profundidad 1), así que en CI esos SHAs históricos no
      # existen y el gate daría 100+ falsos positivos que en local, con el
      # historial completo, no aparecen. Traer todo el historial hace que
      # la regla signifique lo mismo aquí que en el puesto del
      # desarrollador; es la condición para que el gate pueda activarse en
      # `bun run lint` sin romper CI. x00032.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run validate` encadena typecheck + lint + tests con cobertura +
      # generate de examples/ + bench:check. Es el mismo comando que se
      # corre en local: si pasa aquí, pasa allí.
      #
      # El e2e multi-service-isolation de x00028 S4 corre dentro de
      # `bun run test:e2e`. Localmente pasa; en CI su fix definitivo está
      # en x00046 (pendiente de merge). Hasta entonces este e2e puede
      # fallar en el runner por una diferencia de resolución de workspaces
      # Bun entre local y GitHub Actions — ver el TODO al inicio de
      # `tests/e2e/multi-service-isolation.spec.ts`.
      - name: Validate
        run: bun run validate

      # Dependencias vulnerables. Va DESPUÉS de validate para que un
      # aviso de seguridad no tape un fallo de tipos o de tests, y como
      # paso propio para que se vea en cuál de los dos falló.
      #
      # `--audit-level=high` a propósito: un MEDIUM en una dependencia de
      # desarrollo no debe bloquear un PR, pero sí tiene que verse.
      - name: Audit dependencies
        run: bun run security:audit

      # Empaqueta, instala en un proyecto limpio y ejecuta el binario.
      # Caza lo que el repo no ve: un fichero que falta en `files`, un
      # `bin` mal apuntado, un import que se sale del tarball.
      - name: Validate package
        run: bun run validate:package

      # Integration verifier (x00049 S2): las preguntas mecánicas del
      # análisis multiagente — paths obsoletos, IDs de propuesta
      # duplicados, scripts apuntando a rutas inexistentes, workflows
      # con trigger duplicado, lockfile desincronizado. `bun run lint`
      # ya lo corre como parte de `validate`; este step lo ejecuta
      # explícitamente con `--audit` para que el reporte aparezca en
      # el log aunque `validate` haya pasado por cache o se haya
      # truncado.
      - name: Integration verifier
        run: bun run lint:integration-verifier --audit
