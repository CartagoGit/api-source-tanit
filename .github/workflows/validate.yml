name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# El plugin MCP declara `@delendai/core` como dependencia `file:`
# contra un checkout hermano (`../../../../delendai/packages/core`).
# En local eso lo resuelve el desarrollador; en CI hay que materializar
# ese checkout explícitamente. El SHA vive en
# `packages/contracts/constants/core/delendai-sha.constant.ts`
# (`DELENDAI_SHA`) y se refleja aquí en `env` para que el workflow y
# el código se revisen en el mismo commit (slice S0 de `a00012`).
env:
  DELENDAI_SHA: 916238276ddde5480914ce08ec571e70585606ce

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Materializa el checkout hermano que `bun install` necesita para
      # resolver el `file:` del plugin. Va **antes** de `setup-bun` y
      # `bun install`: el install lee `bun.lock`, que apunta a
      # `../../../../delendai/packages/core` desde
      # `packages/plugins/delendai_tanit/`, y eso sólo existe si
      # este step corrió antes.
      #
      # `actions/checkout` NO sirve aquí: exige que `path` esté dentro
      # del workspace del runner, y el hermano vive en `../delendai`
      # (fuera). Un `run: git clone` no tiene esa restricción — el
      # script puede escribir en cualquier ruta del disco del runner. El
      # URL es público (https, sin token): solo lectura de un commit
      # pinneado en DELENDAI_SHA. i00002.
      - name: Materialize delendai sibling
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/CartagoGit/DelendAI "${GITHUB_WORKSPACE}/../delendai"
          git -C "${GITHUB_WORKSPACE}/../delendai" checkout "${DELENDAI_SHA}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # El `exports` de `@delendai/core` apunta sus `types` a `dist/`,
      # que NO viaja en git: el checkout limpio del clone no la trae.
      # El plugin tipa contra `@delendai/core/public` (moduleResolution
      # bundler → `exports["./public"].types` → `dist/public/index.d.ts`),
      # así que sin compilar el core el typecheck del plugin muere con
      # TS2307 "Cannot find module". Compilamos el core del hermano
      # ANTES de instalar: es exactamente lo que el desarrollador tiene
      # en local tras su primer `bun run build` en delendai.
      - name: Build delendai core (dist/ for type resolution)
        run: |
          cd "${GITHUB_WORKSPACE}/../delendai"
          bun install --frozen-lockfile
          bun tools/scripts/compile/build.script.ts packages/core

      # El core publica `jsonc-parser` como dependencia normal, pero su
      # copia instalada con `file:` vive dentro del store aislado de bun
      # (`.bun/@delendai+core@.../node_modules`), que NO la arrastra: con
      # `file:` las dependencias transitivas del paquete enlazado no se
      # instalan. En local la resuelve el node_modules del propio
      # delendai; en CI el checkout limpio no la tiene. Enlazamos la que
      # acaba de instalar el `bun install` del hermano (mismo lockfile).
      - name: "Link jsonc-parser into the file: package store"
        run: |
          STORE_DIR="node_modules/.bun/@delendai+core@file+..+delendai+packages+core+1a2e9f62db74697b/node_modules"
          ln -sfn "${GITHUB_WORKSPACE}/../delendai/node_modules/jsonc-parser" "${STORE_DIR}/jsonc-parser"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run validate` encadena typecheck, los lints del repo, la
      # suite de tests con sus umbrales de cobertura, la generación real
      # de todos los proyectos de examples/ y el presupuesto de forma del
      # scan (`bench:check`: que el coste por fichero no crezca con el
      # tamaño). Es el mismo comando que se corre en local: si pasa aquí,
      # pasa allí.
      - name: Validate
        run: bun run validate

      # Dependencias vulnerables. Va DESPUÉS de validate para que un
      # aviso de seguridad no tape un fallo de tipos o de tests, y como
      # paso propio para que se vea en cuál de los dos falló.
      #
      # `--audit-level=high` a propósito: un MEDIUM en una dependencia de
      # desarrollo no debe bloquear un PR, pero sí tiene que verse.
      - name: Audit dependencies
        run: bun run security:audit

      # Empaqueta, instala en un proyecto limpio y ejecuta el binario.
      # Caza lo que el repo no ve: un fichero que falta en `files`, un
      # `bin` mal apuntado, un import que se sale del tarball.
      - name: Validate package
        run: bun run validate:package
