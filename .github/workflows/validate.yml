name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run validate` encadena typecheck, lint de tools, la suite de
      # tests y la generación real de los 11 proyectos de examples/.
      # Es el mismo comando que se corre en local: si pasa aquí, pasa allí.
      - name: Validate
        run: bun run validate

      # Empaqueta, instala en un proyecto limpio y ejecuta el binario.
      # Caza lo que el repo no ve: un fichero que falta en `files`, un
      # `bin` mal apuntado, un import que se sale del tarball.
      - name: Validate package
        run: bun run validate:package
