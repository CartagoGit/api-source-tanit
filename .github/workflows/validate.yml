name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# El plugin MCP declara `@mcp-vertex/core` como dependencia `file:`
# contra un checkout hermano (`../../../../mcp-vertex/packages/core`).
# En local eso lo resuelve el desarrollador; en CI hay que materializar
# ese checkout explícitamente. El SHA vive en
# `packages/contracts/constants/core/mcp-vertex-sha.constant.ts`
# (`MCP_VERTEX_SHA`) y se refleja aquí en `env` para que el workflow y
# el código se revisen en el mismo commit (slice S0 de `a00012`).
env:
  MCP_VERTEX_SHA: f86e0ee9ee79f2dc82e294bb0030547b1639dbc1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Materializa el checkout hermano que `bun install` necesita para
      # resolver el `file:` del plugin. Va **antes** de `setup-bun` y
      # `bun install`: el install lee `bun.lock`, que apunta a
      # `../../../../mcp-vertex/packages/core` desde
      # `packages/plugins/mcp-vertex_expostman/`, y eso sólo existe si
      # este step corrió antes.
      - name: Checkout mcp-vertex sibling
        uses: actions/checkout@v7
        with:
          repository: CartagoGit/mcp-vertex
          path: ../mcp-vertex
          ref: ${{ env.MCP_VERTEX_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run validate` encadena typecheck, los lints del repo, la
      # suite de tests con sus umbrales de cobertura, la generación real
      # de todos los proyectos de examples/ y el presupuesto de forma del
      # scan (`bench:check`: que el coste por fichero no crezca con el
      # tamaño). Es el mismo comando que se corre en local: si pasa aquí,
      # pasa allí.
      - name: Validate
        run: bun run validate

      # Dependencias vulnerables. Va DESPUÉS de validate para que un
      # aviso de seguridad no tape un fallo de tipos o de tests, y como
      # paso propio para que se vea en cuál de los dos falló.
      #
      # `--audit-level=high` a propósito: un MEDIUM en una dependencia de
      # desarrollo no debe bloquear un PR, pero sí tiene que verse.
      - name: Audit dependencies
        run: bun run security:audit

      # Empaqueta, instala en un proyecto limpio y ejecuta el binario.
      # Caza lo que el repo no ve: un fichero que falta en `files`, un
      # `bin` mal apuntado, un import que se sale del tarball.
      - name: Validate package
        run: bun run validate:package
