name: release-npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run validate

      - name: Validate package tarball
        run: bun run validate:package

      # El `dist-tag` no se escribe a mano: lo dice el gate de canal,
      # que es el mismo que valida la versión. Si se duplica la lógica
      # aquí, un día se desincroniza del gate y el gate deja de decir
      # la verdad.
      - name: Compute the npm dist-tag
        id: dist-tag
        run: echo "tag=$(bun scripts/gates/lint-release-channel.script.ts --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}