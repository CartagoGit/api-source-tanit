# Dependabot tiene dos mitades y esta configuración solo gobierna una.
#
#   · **Actualizaciones** (los PR "bump X from A to B") — se piden aquí,
#     directorio a directorio. Lo que no se nombre, no se actualiza.
#   · **Alertas de seguridad** — salen del *grafo de dependencias*, que
#     GitHub construye escaneando **todos** los manifiestos del repo.
#     Esta configuración **no** las filtra. No hay forma de filtrarlas:
#     el grafo no admite exclusiones por ruta.
#
# La distinción no es teórica, se pagó: al declarar aquí solo los dos
# paquetes reales, las 67 alertas abiertas siguieron exactamente igual
# de abiertas. Las actualizaciones dejaron de llegar; las alertas no.
#
# Y eso importa porque el repo contiene **50 manifiestos que no son
# suyos**: cada proyecto de `examples/` y cada fixture de `tests/` trae
# su `package.json`, `requirements.txt`, `go.mod`, `Gemfile`, `pom.xml` o
# `Cargo.toml`, porque es de ahí de donde los scanners deducen el
# framework. Son proyectos de mentira, recortados a lo justo para
# ejercitar un scanner, y **nadie los instala nunca**. Las 67 alertas
# salían de ellos: las trece rutas señaladas estaban todas bajo
# `examples/` o `tests/`, y ni una sola bajo un paquete real. Mientras
# tanto `bun audit`, que mira lo que sí se instala, seguía en cero.
#
# Eso no es un aviso de seguridad: es ruido que **esconde** los avisos de
# verdad. Sesenta y siete alertas de dependencias que no existen hacen
# que nadie mire la lista, y el día que aparezca una real se pierde entre
# ellas.
#
# Como el grafo no se puede filtrar, la única palanca que queda es lo que
# los manifiestos falsos **declaran**. De ahí la política:
#
#   > Un manifiesto de ejemplo o de fixture declara la versión que
#   > declararía hoy un proyecto real: la vigente y sin avisos abiertos.
#
# Cumplirla no cuesta nada —el código de ejemplo no se ejecuta y las
# versiones no cambian su sintaxis— y a cambio el grafo no tiene nada que
# señalar. `tests/cli/dependabot.spec.ts` la vigila: lleva el suelo de
# versión de cada paquete que llegó a alertar y falla si alguno vuelve a
# bajar de ahí.
#
# Aquí abajo, entonces, solo los directorios que contienen dependencias
# de verdad:
#
#   /                                      el paquete
#   /projects/plugins/mcp-vertex_expostman el plugin, que se publica aparte
#
version: 2

updates:
  # El paquete. Es donde viven las dependencias que sí se instalan.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las de desarrollo se agrupan en un solo PR: son ruido si llegan
      # de una en una, y ninguna acaba en el binario que se distribuye.
      desarrollo:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # El plugin de mcp-vertex es un paquete independiente con su propio
  # `package.json`, y ese sí se instala.
  - package-ecosystem: npm
    directory: "/projects/plugins/mcp-vertex_expostman"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Las acciones del workflow también envejecen, y una acción vieja es
  # código de terceros ejecutándose con el token del repositorio.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
