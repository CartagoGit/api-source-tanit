# Dependabot. Mantiene al día las dependencias de los paquetes que
# **sí se instalan** en el flujo de desarrollo y CI.
#
# Solo entran aquí los directorios que contienen dependencias de
# verdad:
#
#   /                                      el paquete del producto
#   /integrations/delendai              la integración opcional con Delendai
#                                       (NO se publica; ver x00041)
#
# El resto (plugins/, fixtures de e2e, ejemplos) no se instalan y por
# tanto no producen PRs de Dependabot.

version: 2

updates:
  # El paquete del producto (Tanit). Es donde viven las dependencias
  # que sí se instalan.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las de desarrollo se agrupan en un solo PR: son ruido si llegan
      # de una en una, y ninguna acaba en el binario que se distribuye.
      desarrollo:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # La integración opcional con Delendai. Es un paquete independiente
  # con su propio `package.json`, y mantiene `file:` hacia
  # `@delendai/core` (p00007 sigue `done`). Dependabot lo vigila como
  # cualquier otro paquete que se instala localmente.
  - package-ecosystem: npm
    directory: "/integrations/delendai"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Las acciones del workflow también envejecen, y una acción vieja es
  # código de terceros ejecutándose con el token del repositorio.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
