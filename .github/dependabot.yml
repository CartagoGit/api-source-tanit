# Dependabot solo mira las dependencias que este proyecto instala de verdad.
#
# El repo contiene **50 manifiestos que no son suyos**: cada proyecto de
# `examples/` y cada fixture de `tests/` trae su `package.json`,
# `requirements.txt`, `go.mod`, `Gemfile`, `pom.xml` o `Cargo.toml`,
# porque es de ahí de donde los scanners deducen el framework. Son
# proyectos de mentira, recortados a lo justo para ejercitar un scanner,
# y **nadie los instala nunca**.
#
# Dependabot no puede saberlo, así que los escaneaba como si fueran
# dependencias reales. El efecto se midió al fusionar `develop` en
# `main`: las alertas pasaron de 43 a 67 —seis de ellas críticas—
# mientras `bun audit` sobre lo que sí se instala seguía en cero. Los
# ejemplos de GraphQL y tRPC, que son dos ficheros con cuatro
# dependencias declaradas, aportaron 24 alertas ellos solos.
#
# Eso no es un aviso de seguridad: es ruido que **esconde** los avisos de
# verdad. Sesenta y siete alertas de dependencias que no existen hacen
# que nadie mire la lista, y el día que aparezca una real se pierda entre
# ellas.
#
# Aquí se declara qué directorios contienen dependencias de verdad:
#
#   /                                      el paquete
#   /projects/plugins/mcp-vertex_expostman el plugin, que se publica aparte
#
# Todo lo demás queda fuera por omisión — Dependabot solo mira los
# `directory` que se le nombran.
version: 2

updates:
  # El paquete. Es donde viven las dependencias que sí se instalan.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las de desarrollo se agrupan en un solo PR: son ruido si llegan
      # de una en una, y ninguna acaba en el binario que se distribuye.
      desarrollo:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # El plugin de mcp-vertex es un paquete independiente con su propio
  # `package.json`, y ese sí se instala.
  - package-ecosystem: npm
    directory: "/projects/plugins/mcp-vertex_expostman"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Las acciones del workflow también envejecen, y una acción vieja es
  # código de terceros ejecutándose con el token del repositorio.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
