<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("tanit.theme") === "dark" ? "dark" : "light"; } catch {}
    </script>
    <!-- Tauri adds a CSP nonce to static style elements at runtime. -->
    <style id="tanit-style-nonce"></style>
    <title>Tanit</title>
    <link rel="icon" type="image/svg+xml" href="assets/tanit.svg" />
  </head>
  <body>
    <tanit-root></tanit-root>
  </body>
</html>
