<aside class="sidebar" [class.menu-open]="menuOpen()" [attr.aria-label]="i18n.translate('app.navigation')">
  <div class="brand">
    <img class="brand-mark" src="assets/tanit.svg" width="36" height="36" alt="" />
    <div>
      <strong>{{ i18n.translate("app.name") }}</strong>
      <small>{{ i18n.translate("app.subtitle") }}</small>
    </div>
    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="sidebar-navigation"
      (click)="menuOpen.set(!menuOpen())">
      {{ i18n.translate("nav.menu") }}
    </button>
  </div>
  <div id="sidebar-navigation" class="navigation" [class.navigation-entered]="menuOpen()">
    <nav>
      @for (group of groups; track group.id) {
        @if (visibleItems(group); as items) {
          @if (items.length) {
            <section class="group" [attr.aria-labelledby]="groupId(group)">
              <h2 class="group-title" [id]="groupId(group)">{{ i18n.translate(group.labelKey) }}</h2>
              @for (item of items; track item.id) {
                <button type="button" [class.active]="activeId() === item.id"
                  [attr.aria-current]="activeId() === item.id ? 'page' : null" (click)="choose(item.id)">
                  {{ i18n.translate(item.labelKey) }}
                </button>
              }
            </section>
          }
        }
      }
    </nav>
    <button type="button" class="theme" (click)="theme.emit()">{{ themeLabel() }}</button>
  </div>
</aside>
