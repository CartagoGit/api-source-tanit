<section class="recents" aria-labelledby="recent-projects-title">
  <div class="heading"><h2 id="recent-projects-title">{{ i18n.translate("home.recent") }}</h2><button type="button" [disabled]="!store.projects().length" (click)="store.clear()">{{ i18n.translate("home.forgetAll") }}</button></div>
  @if (!store.projects().length) { <p>{{ i18n.translate("home.none") }}</p> } @else { @for (project of store.projects(); track project.path) { <div class="recent"><button type="button" class="open" (click)="selected.emit(project.path)"><strong>{{ projectName(project.path) }}</strong><small>{{ project.path }}</small></button><button type="button" class="forget" [attr.aria-label]="i18n.translate('home.forget') + ' ' + project.path" (click)="store.remove(project.path)">{{ i18n.translate("home.forget") }}</button></div> } }
</section>
