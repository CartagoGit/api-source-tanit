@if (error(); as message) { <p role="alert">{{ message }}</p> }
@if (service(); as value) {
  <article><header><h2>{{ value.serviceId }}</h2><span>{{ value.framework }}</span></header>
    <p>{{ value.operationCount }} {{ i18n.translate("services.operations") }} @if (value.transports?.length) { · {{ value.transports.join(", ") }} }</p>
  </article>
}
