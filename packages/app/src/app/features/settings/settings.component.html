<section aria-labelledby="settings-title">
  <h2 id="settings-title">{{ i18n.translate("settings.title") }}</h2>

  <label>{{ i18n.translate("settings.language") }}
    <select [value]="i18n.locale()" (change)="changeLocale($event)">
      @for (locale of i18n.locales; track locale.code) {
        <option [value]="locale.code">{{ locale.nativeName }}</option>
      }
    </select>
  </label>

  <label>{{ i18n.translate("settings.theme") }}
    <button type="button" (click)="themes.toggle()">
      {{ themes.theme() === "dark" ? i18n.translate("theme.dark") : i18n.translate("theme.light") }}
    </button>
  </label>

  <label>{{ i18n.translate("settings.key") }} <input type="password" [value]="key()" (input)="key.set(inputValue($event))" autocomplete="off" /></label>
  <label><input type="checkbox" [checked]="sessionOnly()" (change)="sessionOnly.set(checked($event))" /> {{ i18n.translate("settings.sessionOnly") }}</label>
  <p class="where">{{ describeWhere() }}</p>
  <button type="button" [disabled]="running()" (click)="save()">{{ running() ? i18n.translate("settings.running") : i18n.translate("settings.saveKey") }}</button>
  <button type="button" [disabled]="running()" (click)="forget()">{{ i18n.translate("settings.forgetKey") }}</button>
  @if (message(); as value) { <p role="status">{{ value }}</p> }
  @if (failure(); as value) { <p role="alert">{{ value }}</p> }
</section>
