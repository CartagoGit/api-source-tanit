<section aria-labelledby="sync-title"><h2 id="sync-title">Sync</h2><button type="button" [disabled]="running()" (click)="run(false)">{{ running() ? "Syncing…" : "Sync project" }}</button><button type="button" [disabled]="running()" (click)="run(true)">Dry run</button>@if (message(); as value) { <p role="status">{{ value }}</p> }@if (result(); as answer) { @if (answer.dryRun) { <ul aria-label="Files that would be written">@for (file of answer.plannedFiles; track file.path) { <li>{{ file.path }} <em>({{ file.change }})</em></li> }</ul> } @else { <ul aria-label="Files written">@for (file of answer.files; track file) { <li>{{ file }}</li> }</ul> } }</section>
