@if (result; as current) { <section class="summary" aria-live="polite"><h2>{{ i18n.translate("export.complete") }}</h2><p>{{ current.files.length }} {{ i18n.translate("export.files") }} <code>{{ current.outputDirectory }}</code>.</p><div class="actions"><button type="button" (click)="openFolder.emit(current.outputDirectory)">{{ i18n.translate("export.openFolder") }}</button><button type="button" (click)="copy(current.files)">{{ i18n.translate("export.copyPaths") }}</button><button type="button" (click)="openPostman.emit()">{{ i18n.translate("export.openPostman") }}</button></div></section> }
