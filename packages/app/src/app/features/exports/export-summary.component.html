@if (result; as current) { <section class="summary" aria-live="polite"><h2>Export complete</h2><p>{{ current.files.length }} file(s) written to <code>{{ current.outputDirectory }}</code>.</p><div class="actions"><button type="button" (click)="openFolder.emit(current.outputDirectory)">Open folder</button><button type="button" (click)="copy(current.files)">Copy paths</button><button type="button" (click)="openPostman.emit()">Open Postman</button></div></section> }
