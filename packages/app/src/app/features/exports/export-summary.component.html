@if (result; as current) { <section class="summary" aria-live="polite"><h2>{{ i18n.translate("export.complete") }}</h2><p>{{ current.files.length }} {{ i18n.translate("export.files") }} <code>{{ current.outputDirectory }}</code>.</p><ul>@for (file of current.files; track file.path) { <li><code>{{ file.path }}</code></li> }</ul><div class="actions"><button type="button" (click)="copy(current.files)">{{ i18n.translate("export.copyPaths") }}</button></div></section> }
