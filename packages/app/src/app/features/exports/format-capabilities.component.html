<section class="capabilities" aria-labelledby="formats-title"><h2 id="formats-title">{{ i18n.translate("export.formats") }}</h2><div class="format-grid">@for (item of capabilities; track item.format) { <button type="button" class="format" [class.selected]="selected.includes(item.format)" (click)="changed.emit(item.format)" [attr.aria-pressed]="selected.includes(item.format)"><strong>{{ item.label }}</strong><small>{{ item.summary }}</small></button> }</div></section>
